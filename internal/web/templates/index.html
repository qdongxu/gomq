<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>gomq management</title>
	<script src="https://unpkg.com/htmx.org@1.9.12"></script>
	<style>
		body { font-family: system-ui, sans-serif; margin: 2rem; }
		h1 { font-size: 1.5rem; }
		h2 { font-size: 1.2rem; margin-top: 1.5rem; }
		.overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(10rem, 1fr)); gap: 1rem; margin-top: .5rem; }
		.card { border: 1px solid #ddd; padding: 1rem; border-radius: .25rem; }
		.card h3 { margin: 0; font-size: .9rem; color: #666; }
		.card p { margin: .5rem 0 0; font-size: 1.5rem; font-weight: bold; }
		table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
		th, td { border: 1px solid #ddd; padding: .5rem; text-align: left; }
		th { background: #f5f5f5; }
		tr:nth-child(even) { background: #fafafa; }
	</style>
</head>
<body>
	<h1>🔧 gomq management</h1>

	<h2>Overview</h2>
	<div class="overview" hx-get="/api/overview" hx-trigger="load, every 5s">
		<div class="card"><h3>Connections</h3><p>–</p></div>
		<div class="card"><h3>Channels</h3><p>–</p></div>
		<div class="card"><h3>Exchanges</h3><p>–</p></div>
		<div class="card"><h3>Queues</h3><p>–</p></div>
		<div class="card"><h3>Consumers</h3><p>–</p></div>
		<div class="card"><h3>Messages</h3><p>–</p></div>
	</div>

	<h2>Connections</h2>
	<table hx-get="/api/connections" hx-trigger="load" hx-target="#connections">
		<thead><tr><th>Remote Address</th><th>State</th><th>Channels</th><th>Heartbeat</th></tr></thead>
		<tbody id="connections"><td colspan="4">Loading…</td></tbody>
	</table>

	<h2>Exchanges</h2>
	<table hx-get="/api/exchanges" hx-trigger="load" hx-target="#exchanges">
		<thead><tr><th>Name</th><th>Type</th></tr></thead>
		<tbody id="exchanges"><td colspan="2">Loading…</td></tbody>
	</table>

	<h2>Queues</h2>
	<table hx-get="/api/queues" hx-trigger="load" hx-target="#queues">
		<thead><tr><th>Name</th><th>Durable</th><th>Messages</th><th>Consumers</th></tr></thead>
		<tbody id="queues"><td colspan="4">Loading…</td></tbody>
	</table>

	<h2>Bindings</h2>
	<table hx-get="/api/bindings" hx-trigger="load" hx-target="#bindings">
		<thead><tr><th>Exchange</th><th>Queue</th><th>Routing Key</th></tr></thead>
		<tbody id="bindings"><td colspan="3">Loading…</td></tbody>
	</table>
</body>
</html>
