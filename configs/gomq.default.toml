# gomq default configuration
# Copy this file and modify as needed.

[network]
# TCP bind addresses for AMQP 0-9-1 clients.
listeners = ["0.0.0.0:5672"]

# Seconds between heartbeat frames. Must be > 0.
heartbeat = 60

# Maximum frame size in bytes. Minimum 4096.
frame_max = 131072

# Maximum channels per connection. Minimum 1.
channel_max = 2048

[log]
# Log level: debug, info, warn, error.
level = "info"

# Log output: stdout, stderr, or file path.
output = "stdout"

[cluster]
# Unique node identifier within the cluster.
node_id = "node-1"

# Peer discovery mode: "static" or "etcd".
discovery = "static"

# Peer addresses for static discovery.
# Format: "node_id@host:port"
nodes = []

[web]
# Whether the management UI is enabled.
enabled = true

# HTTP bind address for the web UI.
listen = "0.0.0.0:15672"

# URL path prefix for reverse-proxy support.
path_prefix = "/"

[auth]
# Placeholder for authentication settings.

[tls]
# TLS/SSL configuration for encrypted AMQP connections.
# When enabled, gomq listens on a second port (default 5671) for TLS.
enabled = false
cert_file = "/path/to/server.crt"
key_file  = "/path/to/server.key"

# Optional: enable mutual TLS (client certificate verification).
# ca_file       = "/path/to/ca.crt"
# verify_client = false

# Optional: restrict cipher suites.
# cipher_suites = ["TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"]

[metrics]
# Prometheus metrics export endpoint.
# When enabled, gomq exposes /metrics on port 15692 (RabbitMQ default).
enabled = false
listen  = "0.0.0.0:15692"
